version: '3.8'

services:
  backend:
    image: ghcr.io/tensorbrew/mlkit-releases-backend:latest
    environment:
      - ENV=cloud
      - DATABASE_URL=sqlite:////app/data/mlkit.db
      - APP_VERSION=${APP_VERSION:-0.1.32}
    volumes:
      - backend_uploads:/app/uploads
      - backend_models:/app/models
      - backend_venv:/app/venv
      - backend_data:/app/data

  frontend:
    image: ghcr.io/tensorbrew/mlkit-releases-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
  backend_models:
  backend_venv:
  backend_data:
